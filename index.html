<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101518">
  <meta name="description" content="Euless Target 货架地图编号编辑器">
  <title>Target 货架地图</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23101518'/%3E%3Cpath d='M12 45V19h40v26M23 19v26m18-26v26' fill='none' stroke='%23f56b5e' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><strong>Target 货架地图</strong><span class="store">Euless · 货架编辑</span></div>
    <span id="count" class="count">0 个编号</span>
  </header>
  <main>
    <div class="toolbar" aria-label="地图工具">
      <div class="segmented" role="group" aria-label="操作模式">
        <button id="addMode" class="active" type="button" aria-pressed="true">＋ 编号</button>
        <button id="browseMode" type="button" aria-pressed="false">查看地图</button>
      </div>
      <div class="zoom-controls" role="group" aria-label="缩放">
        <button id="zoomOut" type="button" aria-label="缩小">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" type="button" aria-label="放大">＋</button>
      </div>
    </div>
    <p id="hint" class="hint">点选货架，填写货架号码和步数。</p>
    <div id="mapViewport" class="map-viewport" tabindex="0" aria-label="Euless Target 货架地图，可滚动查看">
      <div id="mapStage" class="map-stage">
        <div id="svgMount" class="svg-mount" aria-label="Euless Target 完整货架平面图"></div>
        <div id="markers" class="markers"></div>
      </div>
    </div>
    <div class="bottom-row">
      <span>已编号 <b id="savedCount">0</b> 个货架 · 数据保存在此浏览器，可下载备份</span>
      <button id="exportBtn" type="button">下载备份</button>
    </div>
  </main>
  <dialog id="editor">
    <form id="editorForm" method="dialog">
      <div class="dialog-top"><h2 id="dialogTitle">给货架编号</h2><button id="closeBtn" type="button" aria-label="关闭">×</button></div>
      <label>货架号码<input id="shelfName" maxlength="24" autocomplete="off" placeholder="例如 W27" required></label>
      <label>货架总步数<input id="shelfSteps" type="number" min="1" max="500" inputmode="numeric" value="20" required></label>
      <p class="field-note">步数按你从这段货架的一端走到另一端的距离填写。以后可以再改。</p>
      <div class="dialog-actions"><button id="deleteBtn" class="delete" type="button">删除</button><button id="moveBtn" type="button">改选货架</button><button class="save" type="submit">保存</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
